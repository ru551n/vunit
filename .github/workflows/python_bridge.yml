name: 'python bridge'

# Tests of the VHDL Python integration, add_python(): Linux
# (bridge compiled locally), Windows (prebuilt MSVC DLLs), packaging, and that
# normal development is unaffected when the feature is not used.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

#
# Normal development, without NumPy or bridge binaries
#

  normal-dev:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: '🧪 Normal development · ${{ matrix.os }}'
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: '⚙️ Setup GHDL'
      uses: ghdl/setup-ghdl@main
      with:
        backend: mcode

    - name: '🐍 Install VUnit'
      run: |
        python -m pip install -e . pytest --progress-bar off
        ! python -c "import numpy"
        test -z "$(find vunit/python_bridge vunit/vhdl/python -name '*.so' -o -name '*.dll')"

    - name: '🚧 Unit tests'
      run: python -m pytest -ra tests/unit

    - name: '🚧 Builtins without Python support'
      env:
        VUNIT_SIMULATOR: ghdl
      run: |
        python vunit/vhdl/string_ops/run.py -p 4 -o normal_out
        test ! -e normal_out/python_bridge

#
# Linux, bridge compiled on first use
#

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { py: '3.10', sim: nvc }
          - { py: '3.14', sim: nvc }
          - { py: '3.10', sim: ghdl, backend: mcode }
          - { py: '3.14', sim: ghdl, backend: mcode }
          - { py: '3.14', sim: ghdl, backend: llvm }
    name: '🐧 Ubuntu · Python ${{ matrix.py }} · ${{ matrix.sim }} ${{ matrix.backend }}'
    env:
      VUNIT_SIMULATOR: ${{ matrix.sim }}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.py }}

    - name: '⚙️ Setup NVC'
      if: matrix.sim == 'nvc'
      run: |
        curl -fsSL -o nvc.deb https://github.com/nickg/nvc/releases/download/r1.22.1/nvc_1.22.1-1_amd64_ubuntu-24.04.deb
        sudo apt-get install -y ./nvc.deb

    - name: '⚙️ Setup GHDL'
      if: matrix.sim == 'ghdl'
      uses: ghdl/setup-ghdl@main
      with:
        backend: ${{ matrix.backend }}

    - name: '🐍 Install VUnit and NumPy in a virtual environment'
      run: |
        python -m venv "$RUNNER_TEMP/venv with space"
        "$RUNNER_TEMP/venv with space/bin/python" -m pip install numpy -e . --progress-bar off

    - name: '🚧 Feature tests'
      run: '"$RUNNER_TEMP/venv with space/bin/python" vunit/vhdl/python/run.py -p 4 -o "$RUNNER_TEMP/out dir"'

    - name: '🚧 Feature tests with cached bridge'
      run: |
        before="$(ls -l --time-style=full-iso "$RUNNER_TEMP/out dir"/python_bridge/*/libvunit_python_bridge.so)"
        "$RUNNER_TEMP/venv with space/bin/python" vunit/vhdl/python/run.py -p 4 -o "$RUNNER_TEMP/out dir"
        test "$before" = "$(ls -l --time-style=full-iso "$RUNNER_TEMP/out dir"/python_bridge/*/libvunit_python_bridge.so)"

    - name: '🚧 Example'
      run: |
        "$RUNNER_TEMP/venv with space/bin/python" examples/vhdl/embedded_python/run.py -p 4 \
          --without-attributes .optional_deps --without-attributes .expected_failure

#
# Windows, prebuilt MSVC DLLs
#

  dlls:
    uses: ./.github/workflows/python_bridge_dlls.yml

  windows:
    needs: dlls
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10', '3.12', '3.14']
        sim: [nvc, ghdl]
    name: '🟦 Windows · Python ${{ matrix.py }} · ${{ matrix.sim }}'
    env:
      VUNIT_SIMULATOR: ${{ matrix.sim }}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '📥 Download bridge DLLs'
      uses: actions/download-artifact@v4
      with:
        name: python-bridge-dlls
        path: vunit/python_bridge/bin

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.py }}
        architecture: x64

    - name: '⚙️ Setup NVC'
      if: matrix.sim == 'nvc'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/nickg/nvc/releases/download/r1.22.1/nvc-1.22.1.msi -OutFile nvc.msi
        Start-Process msiexec.exe -Wait -ArgumentList '/i', 'nvc.msi', '/qn', '/norestart'
        $bin = Get-ChildItem -Path 'C:\Program Files*' -Recurse -Filter nvc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: '⚙️ Setup GHDL'
      if: matrix.sim == 'ghdl'
      uses: ghdl/setup-ghdl@main
      with:
        backend: mcode

    - name: '🐍 Install VUnit and NumPy in a virtual environment'
      run: |
        python -m venv "$RUNNER_TEMP/venv with space"
        "$RUNNER_TEMP/venv with space/Scripts/python" -m pip install numpy -e . --progress-bar off

    - name: '🚧 Feature tests (no compiler on PATH)'
      run: |
        ! command -v cl
        "$RUNNER_TEMP/venv with space/Scripts/python" vunit/vhdl/python/run.py -p 4 -o "$RUNNER_TEMP/out dir"

    - name: '🚧 Example'
      run: |
        "$RUNNER_TEMP/venv with space/Scripts/python" examples/vhdl/embedded_python/run.py -p 4 \
          --without-attributes .optional_deps --without-attributes .expected_failure

#
# Packaging, sources and DLLs included, no Linux binaries
#

  packaging:
    needs: dlls
    runs-on: ubuntu-latest
    name: '📦 Packaging'
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '📥 Download bridge DLLs'
      uses: actions/download-artifact@v4
      with:
        name: python-bridge-dlls
        path: vunit/python_bridge/bin

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: '📦 Build sdist'
      run: |
        pip install -U setuptools wheel --progress-bar off
        python setup.py sdist

    - name: '🔍 Check sdist content'
      run: |
        tar tzf dist/*.tar.gz > content.txt
        for file in python_bridge/bridge.py python_bridge/runtime.py python_bridge/native/bridge.h python_bridge/native/interpreter.c \
                    vhdl/python/src/python_bridge_pkg.vhd.in vhdl/python/src/python_pkg.vhd vhdl/python/src/python_ffi_pkg_bridge.vhd \
                    vhdl/python/src/python_pkg_fli.c vhdl/python/src/python_pkg_vhpi.vhd \
                    python_pkg.py; do
          grep -q "vunit/$file\$" content.txt || { echo "missing $file"; exit 1; }
        done
        test "$(grep -c 'vunit/python_bridge/bin/vunit_python_bridge-cp3[0-9]*-win_amd64.dll$' content.txt)" = 5
        ! grep -q '\.so$' content.txt
