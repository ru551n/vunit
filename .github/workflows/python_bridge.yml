name: 'python bridge'

# Tests of the VHDL Python integration, add_python(), in the environments
# push.yml does not provide: CPython from python.org with NumPy, on Linux
# (bridge compiled on first use) and Windows (prebuilt MSVC DLLs), and the
# content of the package.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

#
# Linux, bridge compiled on first use
#

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every GHDL backend, since the bridge library is loaded differently by
        # the ones that link ahead of time (llvm, gcc), on a released version
        # and the nightly build
        include:
          - { py: '3.10', sim: nvc }
          - { py: '3.14', sim: nvc }
          - { py: '3.10', sim: ghdl, backend: mcode, ghdl: '6.0.0' }
          - { py: '3.14', sim: ghdl, backend: mcode, ghdl: nightly }
          - { py: '3.14', sim: ghdl, backend: llvm-jit, ghdl: nightly }
          - { py: '3.14', sim: ghdl, backend: llvm, ghdl: '6.0.0' }
          - { py: '3.14', sim: ghdl, backend: llvm, ghdl: nightly }
          - { py: '3.14', sim: ghdl, backend: gcc, ghdl: nightly }
    name: '🐧 Ubuntu · Python ${{ matrix.py }} · ${{ matrix.sim }} ${{ matrix.backend }} ${{ matrix.ghdl }}'
    env:
      VUNIT_SIMULATOR: ${{ matrix.sim }}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.py }}

    - name: '⚙️ Setup NVC'
      if: matrix.sim == 'nvc'
      run: |
        curl -fsSL -o nvc.deb https://github.com/nickg/nvc/releases/download/r1.22.1/nvc_1.22.1-1_amd64_ubuntu-24.04.deb
        sudo apt-get install -y ./nvc.deb

    - name: '⚙️ Setup GHDL'
      if: matrix.sim == 'ghdl'
      uses: ghdl/setup-ghdl@main
      with:
        version: ${{ matrix.ghdl }}
        backend: ${{ matrix.backend }}

    # The environment and the output go to the runner's temporary directory,
    # outside the checkout, so nothing built can end up in the tree. The space
    # in the path is deliberate: the bridge builds command lines and simulator
    # options from these paths.
    - name: '🐍 Install VUnit and NumPy in a virtual environment'
      run: |
        python -m venv "$RUNNER_TEMP/venv with space"
        echo "$RUNNER_TEMP/venv with space/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv with space/bin/pip" install numpy -e . --progress-bar off

    - name: '🚧 Feature tests'
      run: python vunit/vhdl/python/run.py -p 4 -o "$RUNNER_TEMP/out dir"

    - name: '🚧 Example'
      run: python examples/vhdl/embedded_python/run.py -p 4 --without-attributes .optional_deps --without-attributes .expected_failure

#
# Windows, prebuilt MSVC DLLs
#

  dlls:
    uses: ./.github/workflows/python_bridge_dlls.yml

  windows:
    needs: dlls
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10', '3.12', '3.14']
        sim: [nvc, ghdl]
    name: '🟦 Windows · Python ${{ matrix.py }} · ${{ matrix.sim }}'
    env:
      VUNIT_SIMULATOR: ${{ matrix.sim }}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '📥 Download bridge DLLs'
      uses: actions/download-artifact@v4
      with:
        name: python-bridge-dlls
        path: vunit/python_bridge/bin

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.py }}
        architecture: x64

    - name: '⚙️ Setup NVC'
      if: matrix.sim == 'nvc'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/nickg/nvc/releases/download/r1.22.1/nvc-1.22.1.msi -OutFile nvc.msi
        Start-Process msiexec.exe -Wait -ArgumentList '/i', 'nvc.msi', '/qn', '/norestart'
        $bin = Get-ChildItem -Path 'C:\Program Files*' -Recurse -Filter nvc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: '⚙️ Setup GHDL'
      if: matrix.sim == 'ghdl'
      uses: ghdl/setup-ghdl@main
      with:
        backend: mcode

    # Same as on Linux: outside the checkout, with a space in the path
    - name: '🐍 Install VUnit and NumPy in a virtual environment'
      run: |
        python -m venv "$RUNNER_TEMP/venv with space"
        echo "$RUNNER_TEMP/venv with space/Scripts" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv with space/Scripts/pip" install numpy -e . --progress-bar off

    # No compiler on PATH: the prebuilt DLLs must be used
    - name: '🚧 Feature tests'
      run: |
        ! command -v cl
        python vunit/vhdl/python/run.py -p 4 -o "$RUNNER_TEMP/out dir"

    - name: '🚧 Example'
      run: python examples/vhdl/embedded_python/run.py -p 4 --without-attributes .optional_deps --without-attributes .expected_failure

#
# Packaging, sources and DLLs included, no Linux binaries
#

  packaging:
    needs: dlls
    runs-on: ubuntu-latest
    name: '📦 Packaging'
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: '📥 Download bridge DLLs'
      uses: actions/download-artifact@v4
      with:
        name: python-bridge-dlls
        path: vunit/python_bridge/bin

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: '📦 Build sdist'
      run: |
        pip install -U setuptools wheel --progress-bar off
        python setup.py sdist

    # Sources of every kind, the five DLLs, no Linux binary
    - name: '🔍 Check sdist content'
      run: |
        tar tzf dist/*.tar.gz > content.txt
        for file in python_bridge/runtime.py python_bridge/native/bridge.h vhdl/python/src/python_bridge_pkg.vhd.in \
                    vhdl/python/src/python_pkg.vhd vhdl/python/src/python_pkg_fli.c python_pkg.py; do
          grep -q "vunit/$file\$" content.txt || { echo "missing $file"; exit 1; }
        done
        test "$(grep -c 'vunit/python_bridge/bin/vunit_python_bridge-cp3[0-9]*-win_amd64.dll$' content.txt)" = 5
        ! grep -q '\.so$' content.txt
